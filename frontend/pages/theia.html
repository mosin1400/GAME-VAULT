<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Vault Studio</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#eaf5ff;font-family:Vazirmatn,Arial}.card{width:min(440px,calc(100% - 38px));padding:30px;border:1px solid #344d75;border-radius:18px;background:linear-gradient(145deg,#1c2b42,#101724);box-shadow:0 30px 90px #0009}.mark{color:#66e3ff;font:700 11px monospace;letter-spacing:.15em}.card h1{margin:10px 0;font-size:21px}.card p{color:#a9bdd5;font-size:12px;line-height:2}.loader{height:4px;overflow:hidden;border-radius:99px;background:#25364e}.loader i{display:block;width:45%;height:100%;background:linear-gradient(90deg,#5bdff2,#6d8fff);animation:go 1.1s infinite}@keyframes go{to{transform:translateX(-230%)}}html[data-theme="light"] body{background:#edf4fb;color:#17243a}html[data-theme="light"] .card{background:#fff;border-color:#c9d7e8;box-shadow:0 30px 90px #27466f1f}html[data-theme="light"] .mark{color:#176f96}html[data-theme="light"] .card p{color:#52657d}html[data-theme="light"] .loader{background:#d7e2f0}</style><main class="card"><span class="mark">GAME VAULT · THEIA</span><h1>در حال باز کردن Studio</h1><p id="state">سرویس ویرایشگر در حال آماده‌سازی است…</p><div class="loader"><i></i></div></main><script>const state=document.querySelector('#state'),q=new URLSearchParams(location.search),game=q.get('game'),version=q.get('version')||'v1.0.0',theme=localStorage.getItem('gv-theme')==='light'?'light':'dark';document.documentElement.dataset.theme=theme;(async()=>{if(!game)throw Error('بازی مشخص نشده است');const r=await fetch('/api/theia/open',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game,version})}),d=await r.json();if(!r.ok)throw Error(d.error||'Theia باز نشد');state.textContent='محیط آماده شد؛ در حال انتقال…';const target=new URL(d.url);target.searchParams.set('gvTheme',theme);location.replace(target)})().catch(error=>{state.textContent=error.message+' — بازگشت به مدیریت';setTimeout(()=>location.href='/manage.html',4500)})</script></html>
