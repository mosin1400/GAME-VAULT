<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Vault | پروفایل</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/frontend/styles/profile-page.css"><link rel="stylesheet" href="/frontend/styles/foundation.css"><link rel="stylesheet" href="/frontend/styles/theme.css"><script src="/frontend/scripts/theme-sync.js"></script></head>
<body><main class="profile-page"><a href="/" class="back">← بازگشت به Game Vault</a><section class="profile-shell"><div class="profile-intro"><span>GAME VAULT</span><h1>هویت بازی‌های تو، در یک حساب.</h1><p>به‌صورت مهمان مرور کن یا حساب خودت را بساز تا منتخب‌ها و تنظیماتت مستقل بمانند.</p></div><div class="auth-card"><div id="guestState"><div class="guest-icon">👦</div><h2>در حال حاضر مهمان هستی</h2><p>برای ذخیره منتخب‌ها و شخصی‌سازی پروفایل، وارد شو یا حساب بساز.</p><div class="auth-tabs"><button class="auth-tab active" data-auth="login">ورود</button><button class="auth-tab" data-auth="register">ثبت‌نام</button></div><form id="loginForm" autocomplete="off"><label>نام کاربری<input name="username" autocomplete="username" required></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label><button>ورود به حساب</button></form><form id="registerForm" class="hidden" autocomplete="off"><label>نام نمایشی<input name="name" autocomplete="name" required></label><label>نام کاربری انگلیسی<input name="username" pattern="[a-zA-Z0-9_.-]{3,32}" autocomplete="username" required></label><label>رمز عبور<input name="password" type="password" minlength="6" autocomplete="new-password" required></label><label>حرف یا آواتار کوتاه<input name="avatar" maxlength="2" autocomplete="off"></label><button>ساخت حساب</button></form><small id="authError"></small></div><div id="userState" class="hidden"><div class="user-avatar" id="userAvatar">A</div><h2 id="userName"></h2><p id="userRole"></p><form id="profileForm" autocomplete="off"><label>نام نمایشی<input id="profileName" name="name" required></label><label>آواتار کوتاه<input id="profileAvatar" name="avatar" maxlength="2"></label><button>ذخیره پروفایل</button></form><div class="user-info"><span>نام کاربری</span><b id="userUsername"></b></div><div class="user-info"><span>وضعیت</span><b class="online">فعال</b></div><button id="logoutBtn" type="button">خروج از حساب</button><small id="profileMessage"></small></div></div></section></main><script src="profile.js"></script></body></html>
